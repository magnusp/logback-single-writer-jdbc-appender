name: CI & Benchmark

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Amazon Corretto 25
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'

      - name: Run Tests
        run: mvn --batch-mode clean test

      - name: Check for Benchmark Code
        id: check_benchmarks
        run: |
          if [ -d "src/benchmarks/java" ] && [ -n "$(find src/benchmarks/java -name '*Benchmark*.java' 2>/dev/null)" ]; then
            echo "has_benchmarks=true" >> $GITHUB_OUTPUT
          else
            echo "has_benchmarks=false" >> $GITHUB_OUTPUT
          fi

      - name: Run JMH Benchmarks
        if: steps.check_benchmarks.outputs.has_benchmarks == 'true'
        run: |
          mkdir -p target
          mvn --batch-mode test -Pbenchmark

      - name: Store / Compare Benchmark Result
        if: steps.check_benchmarks.outputs.has_benchmarks == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: JMH Benchmarks (SQLite Appender)
          tool: 'jmh'
          output-file-path: target/jmh-result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          comment-always: true
          comment-on-alert: true
          alert-mode: 'larger-is-better'
          alert-threshold: '150%'
          fail-on-alert: false
          summary-always: true
