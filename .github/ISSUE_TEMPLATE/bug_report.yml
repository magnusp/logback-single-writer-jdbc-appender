name: Bug Report
description: File a bug report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps or Code to Reproduce
      description: Please share your Logback configuration and a minimal reproducible example.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: JVM version (e.g. Amazon Corretto 25), OS, Turso/SQLite version, Spring Boot version.
    validations:
      required: true
